# ============================================================================
# SokoKuu TZ — Production Replicated Container Compose Blueprint
# ============================================================================
name: sokokuu-tz-prod

services:
  sokokuu-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ghcr.io/sokokuu-tz/sokokuu-core:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set for SokoKuu Cloud SQL Cluster}
      NEXTSMS_WEBHOOK_SHARED_TOKEN: ${NEXTSMS_WEBHOOK_SHARED_TOKEN:?NEXTSMS_WEBHOOK_SHARED_TOKEN is required}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 32
      TZ: Africa/Dar_es_Salaam
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1024M
          cpus: "1.0"
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sokokuu_prod_net

  sokokuu-pwa:
    image: node:22-alpine
    working_dir: /srv/pwa
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: http://sokokuu-api:8080
      NEXT_PUBLIC_WS_STOMP_URL: ws://sokokuu-api:8080/ws-sokokuu
    depends_on:
      sokokuu-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - sokokuu_prod_net

networks:
  sokokuu_prod_net:
    driver: bridge
