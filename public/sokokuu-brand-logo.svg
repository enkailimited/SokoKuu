<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 216" width="680" height="216" role="img" aria-label="SokoKuu — Nunua • Uza • Jisajili">
  <title>SokoKuu — Nunua • Uza • Jisajili</title>
  <!-- Upper-left deep navy swoosh arc -->
  <path
    d="M126 59 C232 23, 376 7, 514 8 L496 29 C372 28, 240 38, 126 59 Z"
    fill="#00216B"
  />
  <!-- Upper-right & right-edge emerald green swoosh hook -->
  <path
    d="M509 8 C596 8, 650 11, 665 32 C676 48, 672 92, 652 140 C639 170, 622 184, 594 186 L576 186 C600 172, 616 144, 628 96 C635 64, 636 44, 625 35 C612 26, 566 28, 492 29 Z"
    fill="#00BF00"
  />

  <!-- Heavy italic SokoKuu wordmark -->
  <g transform="translate(324, 146) skewX(-11)">
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'DM Sans', 'Segoe UI', system-ui, sans-serif"
      font-weight="800"
      font-size="112"
      letter-spacing="-3.5"
    >
      <tspan fill="#00216B">Soko</tspan><tspan fill="#00BF00">Kuu</tspan>
    </text>
  </g>

  <!-- Left & right tapered accent spear bars -->
  <polygon points="16,179 138,175 138,183" fill="#00216B" />
  <polygon points="512,175 636,179 512,183" fill="#00216B" />

  <!-- Centered tagline with vibrant green dot separators -->
  <text
    x="325"
    y="188"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'DM Sans', 'Segoe UI', Arial, sans-serif"
    font-weight="700"
    font-style="italic"
    font-size="29"
    letter-spacing="0.2"
    fill="#00216B"
  >
    Nunua <tspan fill="#00BF00" font-style="normal" font-size="32" dy="1">&#8226;</tspan><tspan dy="-1"> Uza </tspan><tspan fill="#00BF00" font-style="normal" font-size="32" dy="1">&#8226;</tspan><tspan dy="-1"> Jisajili</tspan>
  </text>
</svg>
